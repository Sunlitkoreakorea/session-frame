[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockgap"
version = "0.1.0"
description = "Streamlit 진행 페이지와 텍스트 세트 분석 스크립트 뼈대"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "openai>=1.50",
  "google-genai>=1.0",
  "pyyaml>=6",
  "python-dotenv>=1",
  "pandas>=2",
  "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]
