[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockgap"
version = "0.1.0"
description = "AI 예상문제 세트 검사 도구와 공부 방법 실험 페이지의 뼈대"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "openai>=1.50",
  "google-genai>=1.0",
  "pyyaml>=6",
  "python-dotenv>=1",
  "pandas>=2",
  "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]
