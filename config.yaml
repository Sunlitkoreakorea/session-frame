# MOCKGAP 설정. 경로는 이 파일이 있는 mockgap/ 폴더 기준이다.

textbook_dir: "sample_textbook"   # 실제 교과서 텍스트 폴더로 바꾼다
data_dir: "data"

# 1단계에서 쓸 단원. units.json 의 키와 똑같이 적는다.
units:
  - "I-2 화학 변화"
  - "II-1 생태계와 환경"

# 단원당, 모델당 생성할 세트 수와 세트당 문항 수
sets_per_unit_per_model: 30
questions_per_set: 20
format_mix:
  객관식: 16
  서술형: 4

# 문제를 만들 모델들. 학생이 실제로 쓰는 앱의 기본 모델에 맞추는 것이 원칙이다.
# openai 와 google 의 모델 이름은 실행 전에 현재 이름으로 확인해서 바꾼다.
providers:
  anthropic:
    model: "claude-opus-5-5"
    effort: "medium"
    fallbacks: true          # 안전 분류기 거절 시 서버가 다른 모델로 이어서 답하게 함
  openai:
    # 2026-11-01 키로 확인한 선택지: gpt-5.5 (날짜 고정 플래그십, 실제 호출 성공), gpt-5.6-*, gpt-6-*, gpt-6.1-* (최신 계열).
    # gpt-5.3-chat-latest 는 폐기됨(404). 연구 원칙은 "학생이 쓰는 앱의 기본 모델"이므로 최종 선택은 확인 후 결정.
    model: "gpt-5.5"
  google:
    model: "gemini-2.5-pro"

# 문항 태깅(학습목표 배정)과 학습목표 추출에 쓰는 저렴한 모델
tagger:
  provider: "openai"
  model: "gpt-5.4-mini"
  effort: "low"

# 교차 검증에서 문항을 다시 푸는 모델들 (providers 의 키). 키가 있는 제공자만 적는다.
solver_providers: ["openai"]

# 자기 선호 실험: 단원×생성모델 칸마다 뽑을 객관식 문항 수, 그중 정답지를 일부러 틀리게 바꿀 비율
self_preference:
  items_per_cell: 20
  corrupt_ratio: 0.5

seed: 20261101
